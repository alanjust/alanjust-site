<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samurai Three in Motion</title>
<style>
  :root {
    --color-bg: #f7f4ee;
    --color-ink: #1a1816;
    --color-ghost: #d6cfc2;
    --color-accent: #c8318a;
    --color-muted: #8a857c;
    --color-line: #dcd6cb;
    --color-focus: #3b6fd8;
    --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif;
    --size-body: 1rem;
    --size-small: 0.875rem;
    --leading-body: 1.5;
    --radius-pill: 999px;
    --space-1: 0.5rem;
    --space-2: 1rem;
    --space-3: 1.5rem;
    --drawing-height: 78vh;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #1a1918; --color-ink: #ece6da; --color-ghost: #45413b; --color-accent: #ff5fb8;
      --color-muted: #8f897f; --color-line: #3a3835; --color-focus: #7aa2ff;
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #1a1918; --color-ink: #ece6da; --color-ghost: #45413b; --color-accent: #ff5fb8;
    --color-muted: #8f897f; --color-line: #3a3835; --color-focus: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-ui);
    font-size: var(--size-body);
    line-height: var(--leading-body);
    display: grid;
    justify-items: center;
    align-content: start;
    gap: var(--space-2);
    padding: var(--space-2);
  }
  .drawing {
    width: 100%;
    height: var(--drawing-height);
    display: block;
    overflow: visible;
    touch-action: none;   /* finger and stylus drags move the ink instead of scrolling the page */
    cursor: crosshair;
  }
  .ink   { fill: var(--color-ink); }
  .paint { fill: var(--color-bg); }    /* the "cel paint": blocks whatever sits behind it */
  .ghost { fill: var(--color-ghost); display: none; }
  .reinking .ghost { display: inline; }

  .controls { display: grid; justify-items: center; gap: var(--space-1); font-size: var(--size-small); color: var(--color-muted); max-width: 32rem; text-align: center; }
  .modes { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-1); border: 0; padding: 0; margin: 0; }
  .modes legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .modes input { position: absolute; opacity: 0; }
  .modes label { padding: var(--space-1) var(--space-2); border: 1px solid var(--color-line); border-radius: var(--radius-pill); cursor: pointer; }
  .modes input:checked + label { border-color: var(--color-ink); color: var(--color-ink); }
  .modes input:focus-visible + label { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-3); }
  .toggle { display: flex; gap: var(--space-1); align-items: center; }
  .toggle input { accent-color: var(--color-accent); }
  .note { margin: 0; min-height: 4.5em; }
</style>
</head>
<body>
  <svg class="drawing" viewBox="90 100 432 610" role="img" aria-label="Inked drawing of a samurai with sword raised and robes flying. The ink reacts to your cursor, finger or stylus.">
    <defs>
      <!-- Re-inking rubs holes into these masks. White = ink shows, black = rubbed out. -->
      <mask id="m-world" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000">
        <rect x="-1000" y="-1000" width="3000" height="3000" fill="white"/><g class="holes"></g>
      </mask>
      <mask id="m-arm" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000">
        <rect x="-1000" y="-1000" width="3000" height="3000" fill="white"/><g class="holes"></g>
      </mask>
    </defs>
    <!-- Back to front, exactly like the Illustrator Layers panel turned upside down -->
    <g id="back"></g>
    <g id="arm"></g>
    <g id="front"></g>
  </svg>

  <section class="controls">
    <fieldset class="modes">
      <legend>Effect</legend>
      <input type="radio" name="mode" id="m-water" value="water" checked><label for="m-water">Ink in water</label>
      <input type="radio" name="mode" id="m-wind" value="wind"><label for="m-wind">Wind through the robes</label>
      <input type="radio" name="mode" id="m-reink" value="reink"><label for="m-reink">Re-inking</label>
    </fieldset>
    <div class="toggles">
      <label class="toggle"><input id="boil" type="checkbox"> Line boil</label>
      <label class="toggle"><input id="sword" type="checkbox" checked> Swinging sword</label>
    </div>
    <p class="note" aria-live="polite"></p>
  </section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.querySelector('.drawing');
  const note = document.querySelector('.note');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- The design, as numbers (all in drawing units) --------------------
  const P = {
    spacing: 1.25,      // a pin every 1.25 units around each ink shape's outline (fine, to keep brush tips sharp)
    paintSpacing: 3,    // the white paint can be coarser; nobody sees its edge

    waterRadius: 80, waterPush: 22, waterStiffness: 300, waterDamping: 12,

    windRadius: 70, windStrength: 7, windStiffness: 140, windDamping: 5, windMaxStretch: 40,
    core: { x: 290, y: 300 },   // roughly his face and chest: things far from here flap more

    // Re-inking: the pointer rubs ink away to a pencil ghost; the ink seeps back
    eraseRadius: 14,    // a stylus pressed hard makes it up to twice as big
    healDelay: 0.5,     // seconds before the ink starts coming back
    healTime: 0.9,      // seconds for a rubbed spot to fill back in
    maxHoles: 700,

    // Line boil: a gentle wobble field, re-drawn ~10 times a second. It's a smooth field
    // rather than random per-point jitter, so both edges of a thin brushstroke move together.
    boilFps: 10, boilCalm: 0.6, boilNear: 1.8, boilWave: 0.13,

    // Swinging arm: hinged at the shoulder
    pivot: { x: 172, y: 231 },
    swordReach: 30, swordGrab: 9, swordStiffness: 70, swordDamping: 3.5,
    swordMaxAngle: 0.2, // radians (about 11°) either way: the range the white paint was tested for
  };

  const NOTES = {
    water: 'The ink leans away from wherever you point and wobbles back when you leave. Press, drag and let go.',
    wind: 'Sweep across him. The faster you move, the harder the gust. The outer robes are looser than the face, so they flap longer.',
    reink: 'Rub the ink away with the cursor, a finger or a stylus, down to the pencil underneath. Leave it alone and the ink seeps back in. Press harder with a stylus for a wider eraser.',
  };

  let mode = 'water', boil = false, swordOn = true;

  // ---- Reading the drawing ----------------------------------------------
  // Illustrator writes each layer as one compound path. Split it into its separate
  // outlines ("subpaths"), with every coordinate made absolute so each can stand alone.
  function splitSubpaths(d) {
    const toks = d.match(/[a-zA-Z]|-?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/g);
    let i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0, cur = '';
    const out = [], n = () => +toks[i++];
    while (i < toks.length) {
      if (/[a-zA-Z]/.test(toks[i])) cmd = toks[i++];
      const rel = cmd === cmd.toLowerCase(), C = cmd.toUpperCase();
      if (C === 'M') { let nx = n(), ny = n(); if (rel) { nx += x; ny += y; } x = sx = nx; y = sy = ny; if (cur) out.push(cur); cur = `M${x},${y}`; cmd = rel ? 'l' : 'L'; }
      else if (C === 'Z') { cur += 'Z'; x = sx; y = sy; }
      else if (C === 'L') { let nx = n(), ny = n(); if (rel) { nx += x; ny += y; } x = nx; y = ny; cur += `L${x},${y}`; }
      else if (C === 'H') { let nx = n(); if (rel) nx += x; x = nx; cur += `L${x},${y}`; }
      else if (C === 'V') { let ny = n(); if (rel) ny += y; y = ny; cur += `L${x},${y}`; }
      else if (C === 'C') { const a = [n(), n(), n(), n(), n(), n()]; if (rel) for (let k = 0; k < 6; k += 2) { a[k] += x; a[k + 1] += y; } cur += `C${a}`; x = a[4]; y = a[5]; }
      else if (C === 'S' || C === 'Q') { const a = [n(), n(), n(), n()]; if (rel) for (let k = 0; k < 4; k += 2) { a[k] += x; a[k + 1] += y; } cur += `${C}${a}`; x = a[2]; y = a[3]; }
      else if (C === 'T') { const a = [n(), n()]; if (rel) { a[0] += x; a[1] += y; } cur += `T${a}`; x = a[0]; y = a[1]; }
      else if (C === 'A') { const a = [n(), n(), n(), n(), n(), n(), n()]; if (rel) { a[5] += x; a[6] += y; } cur += `A${a}`; x = a[5]; y = a[6]; }
      else i++;
    }
    if (cur) out.push(cur);
    return out;
  }

  // Each outline becomes a ring of pins, sampled evenly around it.
  const probe = document.createElementNS(NS, 'path');
  svg.appendChild(probe);
  function pinsFor(d, spacing) {
    probe.setAttribute('d', d);
    const len = probe.getTotalLength();
    const n = Math.max(3, Math.ceil(len / spacing));
    const pins = [];
    for (let i = 0; i < n; i++) {
      const pt = probe.getPointAtLength(len * i / n);
      const loose = Math.min(1, Math.hypot(pt.x - P.core.x, pt.y - P.core.y) / 240);
      pins.push({ rx: pt.x, ry: pt.y, ox: 0, oy: 0, vx: 0, vy: 0, jx: 0, jy: 0, loose });
    }
    return pins;
  }

  // A "shape" is one Illustrator compound path: many outlines drawn as a single SVG path,
  // so holes stay holes.
  const shapes = [];
  function addShape(group, d, role, maskId) {
    const pieces = splitSubpaths(d).map(sub => ({ pins: pinsFor(sub, role === 'paint' ? P.paintSpacing : P.spacing), str: '', dirty: true }));
    const make = cls => {
      const el = document.createElementNS(NS, 'path');
      el.setAttribute('class', cls);
      group.appendChild(el);
      return el;
    };
    const shape = { group, role, pieces, el: null, ghost: null, dirty: true };
    if (role === 'ink') shape.ghost = make('ghost');   // pencil underneath, seen only where ink is rubbed off
    shape.el = make(role);
    if (maskId) shape.el.setAttribute('mask', `url(#${maskId})`);
    shapes.push(shape);
  }

  const data = JSON.parse(document.getElementById('layers').textContent);
  const G = { back: svg.querySelector('#back'), arm: svg.querySelector('#arm'), front: svg.querySelector('#front') };
  for (const layer of ['back', 'arm', 'front']) {
    for (const d of data[layer].paint) addShape(G[layer], d, 'paint');
    for (const d of data[layer].ink) addShape(G[layer], d, 'ink', layer === 'arm' ? 'm-arm' : 'm-world');
  }
  probe.remove();

  // ---- Pointer: mouse, finger and stylus all arrive the same way --------
  let pointer = null, pVel = { x: 0, y: 0 }, lastMove = 0;
  const arm = { angle: 0, spin: 0 };

  function toDrawing(e) {
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: pt.x, y: pt.y, pressure: e.pressure, pen: e.pointerType === 'pen' };
  }
  // Points in the arm's own (un-swung) coordinates
  function rotate(x, y, a) {
    const c = Math.cos(a), s = Math.sin(a), dx = x - P.pivot.x, dy = y - P.pivot.y;
    return [P.pivot.x + dx * c - dy * s, P.pivot.y + dx * s + dy * c];
  }
  const toArm = p => { const [x, y] = rotate(p.x, p.y, -arm.angle); return { ...p, x, y }; };

  function onMove(e) {
    const now = performance.now(), p = toDrawing(e);
    if (pointer && now > lastMove) {
      const dt = (now - lastMove) / 1000;
      pVel.x = pVel.x * 0.5 + ((p.x - pointer.x) / dt) * 0.5;
      pVel.y = pVel.y * 0.5 + ((p.y - pointer.y) / dt) * 0.5;
    }
    if (mode === 'reink' && !reduceMotion) rubAlong(pointer || p, p);
    pointer = p; lastMove = now;
    wake();
  }
  function onLeave() { pointer = null; pVel = { x: 0, y: 0 }; wake(); }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerdown', onMove);
  svg.addEventListener('pointerleave', onLeave);
  svg.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') onLeave(); });
  svg.addEventListener('pointercancel', onLeave);

  // ---- Physics: the same springs as the jelly button ---------------------
  function step(dt) {
    if (performance.now() - lastMove > 60) { pVel.x *= 0.5; pVel.y *= 0.5; }
    if (mode === 'reink') return false;
    let moving = false;
    const live = pointer && !reduceMotion;
    const armPtr = live ? toArm(pointer) : null;
    // The pointer's velocity, turned into the arm's frame too
    const [avx, avy] = live ? (() => { const c = Math.cos(-arm.angle), s = Math.sin(-arm.angle); return [pVel.x * c - pVel.y * s, pVel.x * s + pVel.y * c]; })() : [0, 0];

    for (const sh of shapes) {
      const inArm = sh.group === G.arm;
      const ptr = inArm ? armPtr : pointer;
      const vx0 = inArm ? avx : pVel.x, vy0 = inArm ? avy : pVel.y;
      for (const pc of sh.pieces) {
        let pieceMoving = false;
        for (const p of pc.pins) {
          let tx = 0, ty = 0;
          if (live) {
            const dx = p.rx - ptr.x, dy = p.ry - ptr.y, d = Math.hypot(dx, dy);
            if (mode === 'water' && d < P.waterRadius && d > 0.001) {
              const fall = (1 - d / P.waterRadius) ** 2;
              tx = (dx / d) * P.waterPush * fall; ty = (dy / d) * P.waterPush * fall;
            } else if (mode === 'wind' && d < P.windRadius) {
              const fall = (1 - d / P.windRadius) ** 2;
              p.vx += vx0 * P.windStrength * fall * dt; p.vy += vy0 * P.windStrength * fall * dt;
            }
          }
          if (tx === 0 && ty === 0 && Math.abs(p.ox) + Math.abs(p.oy) + Math.abs(p.vx) + Math.abs(p.vy) < 0.01) {
            p.ox = p.oy = p.vx = p.vy = 0; continue;
          }
          const k = mode === 'water' ? P.waterStiffness : P.windStiffness * (1 - 0.65 * p.loose);
          const c = mode === 'water' ? P.waterDamping : P.windDamping * (1 - 0.5 * p.loose);
          p.vx += (k * (tx - p.ox) - c * p.vx) * dt; p.vy += (k * (ty - p.oy) - c * p.vy) * dt;
          p.ox += p.vx * dt; p.oy += p.vy * dt;
          if (mode === 'wind') {
            const len = Math.hypot(p.ox, p.oy);
            if (len > P.windMaxStretch) { p.ox *= P.windMaxStretch / len; p.oy *= P.windMaxStretch / len; }
          }
          pieceMoving = true;
        }
        if (pieceMoving) { pc.dirty = sh.dirty = true; moving = true; }
      }
    }
    return moving;
  }

  // ---- Swinging arm: a pendulum hinged at the shoulder --------------------
  const armInk = shapes.filter(s => s.group === G.arm && s.role === 'ink');
  function stepArm(dt) {
    if (!swordOn) return false;
    if (pointer && !reduceMotion) {
      const ap = toArm(pointer);
      let near = Infinity;
      for (const s of armInk) for (const pc of s.pieces) for (let i = 0; i < pc.pins.length; i += 4) {
        const p = pc.pins[i];
        near = Math.min(near, Math.hypot(p.rx - ap.x, p.ry - ap.y));
      }
      if (near < P.swordReach) {
        const rx = pointer.x - P.pivot.x, ry = pointer.y - P.pivot.y;
        const pointerSpin = (rx * pVel.y - ry * pVel.x) / Math.max(rx * rx + ry * ry, 400);
        arm.spin += pointerSpin * P.swordGrab * (1 - near / P.swordReach) * dt;
      }
    }
    arm.spin += (-P.swordStiffness * arm.angle - P.swordDamping * arm.spin) * dt;
    arm.angle += arm.spin * dt;
    if (Math.abs(arm.angle) > P.swordMaxAngle) { arm.angle = Math.sign(arm.angle) * P.swordMaxAngle; arm.spin *= -0.3; }
    const moving = Math.abs(arm.angle) + Math.abs(arm.spin) > 0.0005;
    if (!moving) arm.angle = arm.spin = 0;
    const deg = arm.angle * 180 / Math.PI;
    G.arm.setAttribute('transform', deg ? `rotate(${deg.toFixed(2)} ${P.pivot.x} ${P.pivot.y})` : '');
    return moving;
  }

  // ---- Re-inking: rubbing holes in the masks, which heal over time --------
  const holes = [];
  const holeLayers = { world: svg.querySelector('#m-world .holes'), arm: svg.querySelector('#m-arm .holes') };
  let lastRub = null;
  function rubAlong(a, b) {
    const r = P.eraseRadius * (b.pen ? 0.5 + 1.5 * (b.pressure || 0.5) : 1);
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const steps = Math.max(1, Math.ceil(dist / (r * 0.4)));
    for (let i = 1; i <= steps; i++) {
      const p = { x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps };
      if (lastRub && Math.hypot(p.x - lastRub.x, p.y - lastRub.y) < r * 0.35) continue;
      lastRub = p;
      // One hole in the world mask (back and front), one in the arm's own coordinates
      const ap = toArm(p);
      for (const [where, q] of [['world', p], ['arm', ap]]) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', q.x.toFixed(1)); c.setAttribute('cy', q.y.toFixed(1)); c.setAttribute('r', r.toFixed(1));
        c.setAttribute('fill', 'black');
        holeLayers[where].appendChild(c);
        holes.push({ el: c, r, born: performance.now() / 1000 });
      }
    }
    while (holes.length > P.maxHoles) holes.shift().el.remove();
  }
  function stepHoles() {
    if (!holes.length) return false;
    const now = performance.now() / 1000;
    for (let i = holes.length - 1; i >= 0; i--) {
      const h = holes[i];
      const t = (now - h.born - P.healDelay) / P.healTime;
      if (t <= 0) continue;
      if (t >= 1) { h.el.remove(); holes.splice(i, 1); continue; }
      h.el.setAttribute('r', (h.r * (1 - t) * (1 - t)).toFixed(2));   // fast at first, then settling in
    }
    return holes.length > 0;
  }
  function clearHoles() { for (const h of holes) h.el.remove(); holes.length = 0; }

  // ---- Line boil: a smooth wobble field that jumps ~10 times a second -----
  let boilClock = 0;
  function reboil(dt) {
    boilClock += dt;
    if (boilClock < 1 / P.boilFps) return;
    boilClock = 0;
    const ph = Array.from({ length: 4 }, () => Math.random() * Math.PI * 2);
    const w = P.boilWave;
    for (const sh of shapes) {
      const ptr = sh.group === G.arm && pointer ? toArm(pointer) : pointer;
      for (const pc of sh.pieces) {
        for (const p of pc.pins) {
          let amp = P.boilCalm;
          if (ptr) {
            const d = Math.hypot(p.rx - ptr.x, p.ry - ptr.y);
            if (d < P.waterRadius) amp += (P.boilNear - P.boilCalm) * (1 - d / P.waterRadius);
          }
          p.jx = amp * 0.5 * (Math.sin(p.rx * w + ph[0]) + Math.sin(p.ry * w * 0.9 + ph[1]));
          p.jy = amp * 0.5 * (Math.sin(p.rx * w * 0.8 + ph[2]) + Math.sin(p.ry * w * 1.1 + ph[3]));
        }
        pc.dirty = true;
      }
      sh.dirty = true;
    }
  }
  function clearBoil() {
    for (const sh of shapes) { for (const pc of sh.pieces) { for (const p of pc.pins) p.jx = p.jy = 0; pc.dirty = true; } sh.dirty = true; }
  }

  // ---- Drawing: only outlines that changed get rebuilt ---------------------
  function draw() {
    for (const sh of shapes) {
      if (!sh.dirty) continue;
      for (const pc of sh.pieces) {
        if (!pc.dirty) continue;
        let s = '';
        pc.pins.forEach((p, i) => { s += `${i ? 'L' : 'M'}${(p.rx + p.ox + p.jx).toFixed(1)},${(p.ry + p.oy + p.jy).toFixed(1)}`; });
        pc.str = s + 'Z';
        pc.dirty = false;
      }
      const d = sh.pieces.map(pc => pc.str).join('');
      sh.el.setAttribute('d', d);
      if (sh.ghost) sh.ghost.setAttribute('d', d);
      sh.dirty = false;
    }
  }

  // ---- Animation loop: sleeps when nothing is happening -------------------
  let running = false, last = 0;
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    const moving = step(dt);
    const swinging = stepArm(dt);
    const healing = stepHoles();
    if (boil && !reduceMotion) reboil(dt);
    draw();
    if (moving || swinging || healing || pointer || (boil && !reduceMotion)) requestAnimationFrame(tick); else running = false;
  }
  function wake() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }

  // ---- Controls -------------------------------------------------------------
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
    mode = r.value;
    note.textContent = NOTES[mode];
    svg.classList.toggle('reinking', mode === 'reink');
    if (mode !== 'reink') clearHoles();
    lastRub = null;
    wake();
  }));
  document.getElementById('boil').addEventListener('change', e => { boil = e.target.checked; if (!boil) clearBoil(); wake(); });
  document.getElementById('sword').addEventListener('change', e => { swordOn = e.target.checked; arm.angle = arm.spin = 0; G.arm.setAttribute('transform', ''); wake(); });

  note.textContent = NOTES[mode];
  draw();
})();
</script>
</body>
</html>
