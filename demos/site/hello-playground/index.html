<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Playground</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    p { position: absolute; left: 16px; bottom: 12px; margin: 0; color: #999; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p>Drag to draw. Double-tap or double-click to clear.</p>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    function size() {
      const r = devicePixelRatio || 1;
      c.width = innerWidth * r; c.height = innerHeight * r;
      ctx.setTransform(r, 0, 0, r, 0, 0);
    }
    size(); addEventListener('resize', size);
    let hue = 30, down = false, last = null;
    c.addEventListener('pointerdown', e => { down = true; last = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); });
    c.addEventListener('pointerup', () => { down = false; });
    c.addEventListener('pointermove', e => {
      if (!down) return;
      hue = (hue + 2) % 360;
      ctx.strokeStyle = `hsl(${hue} 80% 60%)`;
      ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(e.clientX, e.clientY); ctx.stroke();
      last = [e.clientX, e.clientY];
    });
    c.addEventListener('dblclick', () => ctx.clearRect(0, 0, c.width, c.height));
  </script>
</body>
</html>
