<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phil in Four Inks</title>
<style>
  :root {
    --bg: #f4f1ec;
    --text: #1d1b1a;
    --muted: #6b6560;
    --border: #d9d3cc;
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --fs-body: 0.95rem;
    --fs-small: 0.8rem;
    --lh-body: 1.5;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413;
      --text: #ece8e3;
      --muted: #a39c95;
      --border: #3a3633;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413;
    --text: #ece8e3;
    --muted: #a39c95;
    --border: #3a3633;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }
  section + section { margin-top: var(--space-7); }
  .frame {
    display: block;
    width: 100%;
    height: 980px;
    border: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  footer { padding: var(--space-6) var(--space-5); color: var(--muted); font-size: var(--fs-small); }
</style>
</head>
<body>
  <section>
    <iframe class="frame" src="phil-cmyk.html?layout=stacked" title="Phil, in four inks: the plates in 3D" data-fallback="1500"></iframe>
  </section>

  <section>
    <iframe class="frame" src="phil-misregister.html?layout=stacked" title="Phil, out of register" data-fallback="1800"></iframe>
  </section>

  <section>
    <iframe class="frame" src="phil-paint.html?layout=stacked" title="Phil, hand-colored" data-fallback="1900"></iframe>
  </section>

  <footer>Works with a mouse, a finger or an Apple Pencil.</footer>

<script>
  // Size each frame to fit its page. On the live site all four pages share an
  // address, so this page can look inside them; opened from disk it can't, and
  // the fallback heights apply.
  const frames = [...document.querySelectorAll('.frame')];
  frames.forEach(f => { f.style.height = f.dataset.fallback + 'px'; });

  function fit(f) {
    let doc;
    try { doc = f.contentDocument; } catch (e) { return; }
    if (!doc || !doc.querySelector('.panel')) return;
    // squeeze the frame first so the page reports what it actually needs
    f.style.height = '100px';
    f.style.height = doc.documentElement.scrollHeight + 2 + 'px';
  }
  frames.forEach(f => f.addEventListener('load', () => fit(f)));
  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => frames.forEach(fit), 150); });
</script>
</body>
</html>
